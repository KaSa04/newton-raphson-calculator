<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <!-- Librería math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.1.0/math.min.js"></script>
    <!-- Librería Chart.js para la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Calculadora Newton-Raphson | Análisis Numérico</title>
</head>
<body>

    <div id="diseño-principal">
        <h1>Calculadora Newton-Raphson</h1>
        
        <div class="input-group">
            <label for="funcion">Función f(x):</label>
            <input id="funcion" type="text" value="3x^2-e^x">
        </div>

        <div class="input-group">
            <label for="derivada-input">Derivada f'(x) <span class="opcional">(Opcional)</span>:</label>
            <input id="derivada-input" type="text" placeholder="Se calcula sola si se deja vacío">
        </div>

        <div class="grid-inputs">
            <div class="input-group">
                <label for="inicial">Valor inicial (x<sub>0</sub>):</label>
                <input id="inicial" type="number" value="1">
            </div>

            <div class="input-group">
                <label for="tolerancia">Tolerancia:</label>
                <input id="tolerancia" type="text" value="0.000001">
            </div>
        </div>

        <div class="input-group">
            <label for="max-iter">Máximo de Iteraciones:</label>
            <input id="max-iter" type="number" value="100">
        </div>

        <button onclick="calcular()" id="boton">Calcular Raíz</button>

        <div class="resultado-seccion">
            <h3>Derivada f'(x) usada:</h3>
            <p id="derivada" class="codigo-texto"></p>
        </div>
        
        <h3>Tabla de Iteraciones</h3>
        <div class="table-container">
            <table id="tabla-iteraciones">
                <thead>
                    <tr>
                        <th>Iteración</th>
                        <th>x<sub>i</sub></th>
                        <th>f(x<sub>i</sub>)$</th>
                        <th>f'(x<sub>i</sub>)</th>
                        <th>Ea%</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>

        <div class="resultado-final-box">
            <h3 id="raiz">Raíz aproximada:</h3>
            <p id="resul">-</p>
        </div>
        
        <p id="error"></p>

        <h3>Gráfica de la Función</h3>
        <div class="chart-container">
            <canvas id="graficaFuncion"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
